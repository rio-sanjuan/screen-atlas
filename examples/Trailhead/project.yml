# A made-up hiking app, here to show what ScreenAtlas draws. Everything in it is
# invented. The Xcode project is generated from this file and not checked in, and
# `screenatlas capture` generates it if it's missing.
name: Trailhead
options:
  bundleIdPrefix: dev.screenatlas.example
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    # Only ever run in a simulator, so it needs no signing team.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
targets:
  Trailhead:
    type: application
    platform: iOS
    sources: [App]
schemes:
  Trailhead:
    build:
      targets:
        Trailhead: all
